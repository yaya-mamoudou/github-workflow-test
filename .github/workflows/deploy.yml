name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Ship to server and restart
        env:
          DEPLOY_DIR_RAW: ${{ secrets.DEPLOY_DIR }}
        run: |
          # Exit on error, treat unset variables as errors, fail pipelines if any step fails.
          set -euo pipefail

          # Turn the secret into a single clean path (no trailing newline/spaces from the editor).
          TARGET="$(printf '%s' "$DEPLOY_DIR_RAW" | tr -d '\r' | sed 's/[[:space:]]*$//')"
          test -n "$TARGET"

          # Reusable connection strings (this job runs on GitHub; the commands hit your server).
          HOST="${{ secrets.USER }}@${{ secrets.HOST }}"
          SSH="ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa"
          SCP="scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa"

          # Create the deploy folder on the server (use bash -s + $1 like below — nested " quotes break bash -c "... $TARGET ...").
          $SSH "$HOST" bash -s -- "$TARGET" <<'EOF'
          mkdir -p -- "$1"
          EOF

          # Upload everything under dist/ into that folder.
          $SCP -r dist/* "$HOST:$TARGET"

          # Run the block between <<'REMOTE' and REMOTE on the server. $1 is TARGET (passed after --).
          # Quotes around 'REMOTE' stop GitHub’s runner from expanding $variables meant for the server.
          $SSH "$HOST" bash -s -- "$TARGET" <<'REMOTE'
          set -euo pipefail
          cd "$1"

          # Non-interactive SSH often skips nvm; load it if present.
          export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

          # Fail fast if Node was installed in a way this script does not load (e.g. only fnm).
          command -v npm >/dev/null || { echo "npm not found on server PATH"; exit 127; }

          # Production deps only; devDependencies were already used on GitHub for the build.
          npm install --omit=dev

          # Keep one PM2 process named "portfolio": restart if it exists, otherwise create it.
          if pm2 describe portfolio >/dev/null 2>&1; then
            pm2 restart portfolio
          else
            pm2 start server.js --name portfolio
          fi

          # Persist the process list so PM2 brings the app back after a reboot (if pm2 startup is set).
          pm2 save
          REMOTE

name:  GCP Deployment

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - run: npm run build
      - name: Get ssh key and set permissions
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
      - name: Deploy to AWS
        env:
          DEPLOY_DIR_RAW: ${{ secrets.DEPLOY_DIR }}
        run: |
          DEPLOY_DIR="$(printf '%s' "$DEPLOY_DIR_RAW" | tr -d '\r' | sed 's/[[:space:]]*$//')"
          if [ -z "$DEPLOY_DIR" ]; then
            echo "DEPLOY_DIR secret is empty" >&2
            exit 1
          fi
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa "${{ secrets.USER }}@${{ secrets.HOST }}" bash -s -- "$DEPLOY_DIR" <<'EOF'
          mkdir -p "$1"
          EOF
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa -r dist/* "${{ secrets.USER }}@${{ secrets.HOST }}:$DEPLOY_DIR"
      - name: Restart Server
        env:
          DEPLOY_DIR_RAW: ${{ secrets.DEPLOY_DIR }}
        run: |
          DEPLOY_DIR="$(printf '%s' "$DEPLOY_DIR_RAW" | tr -d '\r' | sed 's/[[:space:]]*$//')"
          if [ -z "$DEPLOY_DIR" ]; then
            echo "DEPLOY_DIR secret is empty" >&2
            exit 1
          fi
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa "${{ secrets.USER }}@${{ secrets.HOST }}" bash -s -- "$DEPLOY_DIR" <<'REMOTE_SCRIPT'
          set -euo pipefail
          DEPLOY_DIR_REMOTE="$1"
          export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
          if [ -s "$NVM_DIR/nvm.sh" ]; then
            . "$NVM_DIR/nvm.sh"
          fi
          if [ -f "$HOME/.asdf/asdf.sh" ]; then
            . "$HOME/.asdf/asdf.sh"
          fi
          if command -v fnm >/dev/null 2>&1; then
            eval "$(fnm env)"
          fi
          if [ -d "$HOME/.volta" ]; then
            export VOLTA_HOME="$HOME/.volta"
            export PATH="$VOLTA_HOME/bin:$PATH"
          fi
          if ! command -v npm >/dev/null 2>&1; then
            echo "npm not found after loading nvm/fnm/volta. On the server run: command -v npm; which node" >&2
            exit 127
          fi
          mkdir -p "$DEPLOY_DIR_REMOTE"
          cd "$DEPLOY_DIR_REMOTE"
          npm install --omit=dev
          if pm2 describe cloud-learn >/dev/null 2>&1; then
            pm2 restart cloud-learn
          else
            pm2 start server.js --name cloud-learn
          fi
          pm2 save
          REMOTE_SCRIPT